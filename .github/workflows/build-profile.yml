name: Build profile

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/build_profile.py
      - .github/workflows/build-profile.yml
      - assets/fonts/**

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Exit 3 means a source failed and its card kept the last good data:
      # commit what did refresh, then fail the run so the breakage is seen.
      - name: Build README and cards
        id: build
        run: |
          set +e
          uv run .github/scripts/build_profile.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 0 ] || [ "$code" -eq 3 ]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet && exit 0
          git commit -m "Refresh profile cards"
          git push

      - name: Fail on stale sources
        if: steps.build.outputs.code == '3'
        run: |
          echo "::error::A data source failed; see the build step log for which card kept old data."
          exit 1
